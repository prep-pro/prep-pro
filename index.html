<div id="splash" aria-hidden="true"><canvas id="smoke"></canvas><div class="lg">PREP<b>.PRO</b></div><div class="tl">AS 5 MARCHAS</div></div>

<script>
// ---- Abertura: logo surgindo da fumaça (uma vez por abertura do app; toque para pular) ----
(function splash() {
  const el = document.getElementById('splash'); if (!el) return;
  let seen = false;
  try { seen = sessionStorage.getItem('pp_splash') === '1'; sessionStorage.setItem('pp_splash', '1'); } catch (e) {}
  if (seen) { el.remove(); return; }
  const lg = el.querySelector('.lg'), tl = el.querySelector('.tl');
  let done = false, raf;
  const end = () => { if (done) return; done = true; el.classList.add('out'); setTimeout(() => { cancelAnimationFrame(raf); el.remove(); }, 650); };
  el.addEventListener('click', end);
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { lg.classList.add('on'); tl.classList.add('on'); setTimeout(end, 1200); return; }
  const cv = document.getElementById('smoke'), ctx = cv.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1);
  let W, H; const size = () => { W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr; }; size(); addEventListener('resize', size);
  const parts = [], t0 = performance.now();
  const spawn = n => { for (let i = 0; i < n; i++) parts.push({
    x: W * (.1 + Math.random() * .8), y: H * (.45 + Math.random() * .5),
    vx: (Math.random() - .5) * .9 * dpr, vy: -(1.2 + Math.random() * 2) * dpr,
    r: (20 + Math.random() * 40) * dpr, g: (.5 + Math.random() * .9) * dpr, life: 0, max: 170 + Math.random() * 140, tone: 120 + Math.floor(Math.random() * 70) }); };
  const frame = t => {
    ctx.clearRect(0, 0, W, H);
    if (t - t0 < 2200) spawn(4);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.life++; p.x += p.vx; p.y += p.vy; p.r += p.g; p.vx *= .995;
      const k = p.life / p.max; if (k >= 1) { parts.splice(i, 1); continue; }
      const a = k < .25 ? k / .25 * .11 : .11 * (1 - (k - .25) / .75);
      const gr = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      gr.addColorStop(0, `rgba(${p.tone},${p.tone},${p.tone + 8},${a})`); gr.addColorStop(1, `rgba(${p.tone},${p.tone},${p.tone},0)`);
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    if (!done) raf = requestAnimationFrame(frame);
  };
  raf = requestAnimationFrame(frame);
  const fonts = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 700))]) : Promise.resolve();
  fonts.then(() => setTimeout(() => { lg.classList.add('on'); tl.classList.add('on'); }, 450));
  setTimeout(end, 3500);
})();

// ---- Configuração do Supabase (chave pública: pode ficar no app) ----
const SB_URL = 'https://ovmxkdekeotvtqpcetsj.supabase.co';
const SB_KEY = 'sb_publishable_VD6fSI_xcJI50fNWayQoAg_sUTTHLQa';
const sb = window.supabase.createClient(SB_URL, SB_KEY);

const MARCHAS = ['O que você quer', 'O que você tem', 'O que você precisa', 'Quem faz', 'Execução', 'Acerto fino'];
const SHORT = ['Quer', 'Tem', 'Precisa', 'Quem faz', 'Executa', 'Acerto'];
const GOALS = [['rua','Rua forte','Turbo no dia a dia'],['arrancada','Arrancada','Tempo no 402 m'],['offroad','Off-road','Trilha e lama'],['track','Track day','Curva e freio'],['visual','Visual / stance','Roda, altura, estética'],['restauro','Restauração','Clássico original']];
const PRAZOS = ['6 meses','1 ano','2 anos','Sem pressa'];
// 2ª marcha: o que a base precisa aguentar, por tipo de projeto
const CHECKS = {
  forca: ['Compressão dos cilindros', 'Embreagem', 'Arrefecimento', 'Câmbio e diferencial', 'Freios'],
  offroad: ['Tração 4x4', 'Suspensão', 'Arrefecimento', 'Freios', 'Ferrugem no chassi'],
  visual: ['Lataria e ferrugem', 'Parte elétrica', 'Suspensão', 'Motor e vazamentos', 'Interior']
};
const TPL_OF = { rua: 'forca', arrancada: 'forca', track: 'forca', offroad: 'offroad', visual: 'visual', restauro: 'visual' };
const checksFor = goal => CHECKS[TPL_OF[goal] || 'forca'];
const CHECK_OPTS = [['ok', 'OK'], ['verificar', 'Revisar'], ['nao_sei', 'Não sei']];
const BRANDS = ['Chevrolet', 'Volkswagen', 'Fiat', 'Ford'];
const HAS_OPTS = [['', 'Preciso'], ['guardado', 'Guardado'], ['no_carro', 'No carro']];
const ST_LABEL = { lista: 'Na lista', comprado: 'Comprado', instalado: 'Instalado' };
const ST_NEXT = { lista: 'comprado', comprado: 'instalado', instalado: 'lista' };
const TIPOS = { peca: 'Peça', mao_de_obra: 'Mão de obra', frete: 'Frete', servico: 'Serviço', outro: 'Outro' };
const TIPO_COR = { peca: ['#10273A', '#8CCBF7'], mao_de_obra: ['#3A3010', '#FFD66B'], frete: ['#2A1A3A', '#C9A8FF'], servico: ['#143222', '#7FE0A8'], outro: ['#2A2D33', '#C9C6C0'] };
const COLORS = ['#9A2A2A','#C9A227','#2D5F94','#2E8B57','#7A4FB5','#D2691E'];

const S = { user: null, view: 'loading', mode: 'entrar', projects: [], cars: [], draft: null, step: 1, P: null, tab: 'marchas', gview: 'lista', phase: null, busy: false, armed: null, form: null, pick: { brand: '', q: '' }, pickOpen: false };
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const back = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
const num = v => (v === null || v === undefined || v === '') ? 0 : Number(v);
const brl = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
const brl2 = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const fmtIn = v => (v === null || v === undefined) ? '' : Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
function parseMoney(s) {
  s = String(s || '').replace(/[R$\s]/g, '');
  if (!s) return null;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if ((s.match(/\./g) || []).length > 1 || /\.\d{3}$/.test(s)) s = s.replace(/\./g, '');
  const n = parseFloat(s); return isNaN(n) ? null : Math.round(n * 100) / 100;
}
let toastT;
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', 3200); }
function fail(e) { console.error(e); toast('Erro: ' + (e?.message || e)); }
function goalName(id) { const g = GOALS.find(g => g[0] === id); return g ? g[1] : id; }
function segs(m) { let h = ''; for (let n = 1; n <= 6; n++) h += `<i class="${n < m ? 'd' : n === m ? 'c' : ''}"></i>`; return `<div class="segs">${h}</div>`; }
const carName = c => [c.marca, c.modelo, c.versao, c.motor].filter(Boolean).join(' ');
const fmtNum = v => Number(v).toLocaleString('pt-BR');
function carLine(p) { const c = p.car_models, f = p.ficha || {}; return c ? carName(c) + (f.ano ? ' · ' + f.ano : '') : (p.tem_carro ? (f.obs || 'Carro próprio') : 'Ainda é um sonho'); }
function sumBy(arr, f) { return arr.reduce((a, x) => a + num(f(x)), 0); }
function shortStage(s) { return s ? s.nome.split(' · ')[0] : 'Geral'; }
function tag(t) { const c = TIPO_COR[t] || TIPO_COR.outro; return `<span class="tag" style="background:${c[0]};color:${c[1]}">${(TIPOS[t] || t).toUpperCase()}</span>`; }
// Confirmação em dois toques (sem pop-ups)
function armed(key) { return S.armed === key; }
function arm(key) { if (S.armed === key) { S.armed = null; return true; } S.armed = key; render(); setTimeout(() => { if (S.armed === key) { S.armed = null; render(); } }, 4000); return false; }

// ---------------- Início ----------------
async function init() {
  sb.auth.onAuthStateChange((ev, s) => {
    const was = !!S.user; S.user = s?.user || null;
    if (ev === 'PASSWORD_RECOVERY') { S.view = 'newpass'; render(); return; }
    if (!S.user && was) { S.view = 'login'; render(); }
  });
  const { data: { session } } = await sb.auth.getSession();
  S.user = session?.user || null;
  if (S.view === 'newpass') return;
  if (S.user) await loadGarage(); else { S.view = 'login'; render(); }
}

// ---------------- Login e senha ----------------
function viewLogin() {
  const signup = S.mode === 'criar';
  return `
  <div class="brand">PREP<b>.PRO</b></div>
  <h1 style="font-size:40px">Todo carro preparado começou como um sonho.</h1>
  <p class="mut">As 5 Marchas: do sonho ao carro pronto, na ordem certa.</p>
  <div class="col" style="margin-top:8px">
    ${signup ? `<label class="f">Nome<input id="nome" autocomplete="name" placeholder="Seu nome"></label>` : ''}
    <label class="f">E-mail<input id="email" type="email" autocomplete="email" inputmode="email" placeholder="voce@email.com"></label>

async function createProject() {
  const d = S.draft;
  S.busy = true; render();
  try {
    const { data: tpls, error: e1 } = await sb.from('templates').select('id,objetivos');
    if (e1) throw e1;
    if (!tpls?.length) throw new Error('Nenhum plano no catálogo. Rode o script do banco no Supabase.');
    const tpl = tpls.find(t => (t.objetivos || []).includes(d.objetivo)) || tpls[0];
    const { data: p, error: e2 } = await sb.from('projects').insert({
      user_id: S.user.id, nome: d.nome || 'Meu projeto', objetivo: d.objetivo, orcamento_total: d.orc, orcamento: d.orc ? brl(d.orc) : null, prazo: PRAZOS[d.prazo],
      tem_carro: !!d.tem_carro, car_model_id: d.car_model_id, template_id: tpl.id, marcha: 3, cor: COLORS[S.projects.length % COLORS.length],
      ficha: { ano: d.ano ? +d.ano || d.ano : null, obs: d.detalhe || null }
    }).select().single();
    if (e2) throw e2;
    const answered = Object.entries(d.tem_carro ? d.checks : {});
    if (answered.length) {
      const { error } = await sb.from('project_diagnostics').insert(answered.map(([item, status]) => ({ project_id: p.id, item, status })));
      if (error) throw error;
    }
    const c = S.cars.find(x => x.id === d.car_model_id);
    const inicio = [c ? carName(c) : null, d.ano, d.detalhe].filter(Boolean).join(' · ');
    if (inicio) await sb.from('diary_entries').insert({ project_id: p.id, texto: 'Início do projeto: ' + inicio });
    const { data: st, error: e3 } = await sb.from('template_stages').select('id,ordem,template_items(id)').eq('template_id', tpl.id);
    if (e3) throw e3;
    // todas as linhas com as mesmas colunas (o insert em lote exige)
    const rows = st.flatMap(s => s.template_items.map(i => ({ project_id: p.id, template_item_id: i.id, stage_id: null, nome: null, origem: null, status: 'lista' })));
    const s0 = st.find(s => s.ordem === 0) || st[0];
    answered.filter(([, s]) => s !== 'ok').forEach(([item, s]) => rows.push({ project_id: p.id, template_item_id: null, stage_id: s0.id, nome: (s === 'verificar' ? 'Revisar: ' : 'Verificar: ') + item, origem: 'diag:' + item, status: 'lista' }));
    if (rows.length) { const { error } = await sb.from('project_items').insert(rows); if (error) throw error; }
    S.busy = false; toast('Plano gerado! Toque em qualquer marcha para avançar.');

}

async function openProject(id, keepView) {
  await loadCars();
  S.pickOpen = false; S.pick = { brand: '', q: '' };
  const [pr, it, dg, ps, cy, ex, cx] = await Promise.all([
    sb.from('projects').select('*, car_models(*)').eq('id', id).single(),
    sb.from('project_items').select('*').eq('project_id', id),
    sb.from('project_diagnostics').select('*').eq('project_id', id),
    sb.from('project_stages').select('*').eq('project_id', id),
    sb.from('project_cycles').select('*').eq('project_id', id).order('numero'),
    sb.from('project_expenses').select('*').eq('project_id', id).order('data', { ascending: false }),
    sb.from('project_caixa').select('*').eq('project_id', id).order('criado_em', { ascending: false })
  ]);
  if (cx.error) toast('Falta rodar o script prep-pro-v5-migracao.sql no Supabase.');
  if (pr.error) return fail(pr.error);
  if (ex.error) toast('Falta rodar o script prep-pro-v3-migracao.sql no Supabase.');
  const { data: stages, error } = await sb.from('template_stages').select('id,ordem,nome,quem_faz,e_legalizacao, template_items(id,ordem,nome)').eq('template_id', pr.data.template_id).order('ordem');
  if (error) return fail(error);
  stages.sort((a, b) => a.ordem - b.ordem);
  stages.forEach(s => s.template_items.sort((a, b) => a.ordem - b.ordem));
  const cycles = cy.data || [];
  S.P = { p: pr.data, items: it.data || [], diag: dg.data || [], stages, pst: Object.fromEntries((ps.data || []).map(r => [r.stage_id, r])),
    cycle: cycles.filter(c => !c.fechado_em).pop() || null, closed: cycles.filter(c => c.fechado_em).length, exp: ex.data || [], caixa: cx.data || [], diary: null };
  if (!keepView) S.view = 'project';
  if (!S.phase) S.phase = currentPhase();
  render(); syncMarcha();
  if (S.tab === 'diario') loadDiary();
}
function stageItems(s) {
  const P = S.P, out = [];
  s.template_items.forEach(ti => { const pi = P.items.find(i => i.template_item_id === ti.id); if (pi) out.push({ pi, nome: ti.nome }); });
  P.items.filter(i => !i.template_item_id && i.stage_id === s.id).forEach(pi => out.push({ pi, nome: pi.nome || 'Item' }));
  return out;
}
function itemName(pi) { if (!pi) return ''; if (pi.nome) return pi.nome; for (const s of S.P.stages) { const t = s.template_items.find(t => t.id === pi.template_item_id); if (t) return t.nome; } return 'Item'; }
function progress() {
  const P = S.P, p = P.p, items = P.items, n = items.length || 1;
  const work = P.stages.filter(s => !s.e_legalizacao), wN = work.length || 1, stN = P.stages.length || 1;
  const f = p.ficha || {}, chk = checksFor(p.objetivo);
  const answered = chk.filter(k => P.diag.some(d => d.item === k)).length;
  const c = P.cycle;
  return [
    ((p.objetivo ? 1 : 0) + (num(p.orcamento_total) > 0 ? 1 : 0) + (p.prazo ? 1 : 0)) / 3,
    p.tem_carro ? ((p.car_model_id || f.obs ? .25 : 0) + (f.ano ? .25 : 0) + answered / chk.length * .5) : (p.car_model_id ? 1 : 0),
    work.filter(s => P.exp.some(e => e.stage_id === s.id)).length / wN,
    P.stages.filter(s => (P.pst[s.id]?.quem_faz || '').trim()).length / stN,
    items.filter(i => i.status === 'instalado').length / n,
    c ? ((c.testes ? 1 : 0) + (c.regulagem ? 1 : 0) + (c.ajustes ? 1 : 0)) / 3 : (P.closed ? 1 : 0)
  ];
}
function currentPhase() { const pr = progress(); const i = pr.findIndex(x => x < 0.999); return i < 0 ? 6 : i + 1; }
function syncMarcha() {
  if (!S.P) return; const m = currentPhase(), p = S.P.p;
  if (p.marcha !== m) { p.marcha = m; sb.from('projects').update({ marcha: m }).eq('id', p.id).then(({ error }) => error && console.error(error)); }

function money(list) { list = list || S.P.exp; return { prev: sumBy(list, e => e.valor_previsto), real: sumBy(list, e => e.valor_realizado), total: num(S.P.p.orcamento_total) }; }

      <circle cx="${x}" cy="${y}" r="${R}" fill="none" stroke="#2A2D33" stroke-width="5"/>
      <circle cx="${x}" cy="${y}" r="${R}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(f * C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${x} ${y})"/>
      <text x="${x}" y="${y + 6}" text-anchor="middle" font-family="Barlow Condensed, Barlow, system-ui, sans-serif" font-weight="800" font-size="${n === 6 ? 16 : 19}" fill="${done ? '#7FE0A8' : '#F2EFEA'}">${n === 6 ? 'AF' : n + 'ª'}</text>
      <text x="${x}" y="${top ? y - 40 : y + 50}" text-anchor="middle" font-family="Barlow, system-ui, sans-serif" font-weight="600" font-size="12" fill="${n === cur ? '#FF8A4C' : '#A7AAB0'}">${SHORT[n - 1]}${n === cur ? ' ●' : ''}</text>
    </g>`;
  }
  return `<svg viewBox="0 0 340 222" aria-label="Câmbio das 5 marchas"><path d="M60 52 V162 M170 52 V162 M280 52 V162 M60 107 H280" stroke="#2A2D33" stroke-width="8" stroke-linecap="round" fill="none"/>${knobs}</svg>`;
}

      ${groups.map(g => { const sm = money(stageExp(g.id)); if (!sm.prev && !sm.real && g.id === null) return ''; const max = Math.max(sm.prev, sm.real, 1), over = sm.prev && sm.real > sm.prev;

function copyTsv() {

async function saveExpense() {
  keepForm(); const f = S.form, P = S.P;
  if (!f.descricao.trim()) return toast('Escreva a descrição do gasto.');
  if (f.prev === null && f.real === null) return toast('Preencha o valor previsto, o realizado ou os dois.');
  const row = { project_id: P.p.id, stage_id: f.stage_id || null, project_item_id: f.project_item_id || null, tipo: f.tipo, descricao: f.descricao.trim(), fornecedor: f.fornecedor.trim() || null, valor_previsto: f.prev, valor_realizado: f.real, data: f.data || today() };
  S.busy = true; render();
  try {
    if (f.id) {
      const { data, error } = await sb.from('project_expenses').update(row).eq('id', f.id).select().single(); if (error) throw error;
      P.exp = P.exp.map(e => e.id === f.id ? data : e);
    } else {
      const { data, error } = await sb.from('project_expenses').insert(row).select().single(); if (error) throw error;
      P.exp.unshift(data);
    }
    P.exp.sort((a, b) => (b.data || '').localeCompare(a.data || ''));
    if (row.project_item_id && row.valor_realizado !== null) {
      const it = P.items.find(i => i.id === row.project_item_id);
      if (it && it.status === 'lista') { it.status = 'comprado'; it.comprado_em = new Date().toISOString(); await sb.from('project_items').update({ status: 'comprado', comprado_em: it.comprado_em }).eq('id', it.id); }
    }
    S.busy = false; S.view = 'project'; S.tab = S.formBack || 'gastos'; S.form = null; render(); syncMarcha();
    toast(f.id ? 'Lançamento atualizado.' : 'Gasto lançado!');
  } catch (e) { S.busy = false; render(); fail(e); }
}
async function deleteExpense() {
  if (!arm('delexp')) return;
  const f = S.form, P = S.P;
  const { error } = await sb.from('project_expenses').delete().eq('id', f.id);
  if (error) return fail(error);
  P.exp = P.exp.filter(e => e.id !== f.id);
  S.view = 'project'; S.tab = S.formBack || 'gastos'; S.form = null; render(); syncMarcha(); toast('Lançamento excluído.');
}

async function cycleItem(id) {
  const it = S.P.items.find(i => i.id === id); if (!it) return;
  const next = ST_NEXT[it.status], now = new Date().toISOString();

// ---------------- Caixinha ----------------
const GRUPO = { peca: 'pecas', frete: 'pecas', mao_de_obra: 'mo', servico: 'mo', outro: 'outros' };
function addMonths(n) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + n); return d.toLocaleDateString('pt-BR', { month: 'short', year: '2-digit' }).replace('.', ''); }
function caixaCalc() {
  const P = S.P, p = P.p, desde = p.caixa_desde ? new Date(p.caixa_desde) : null;
  const movs = desde ? P.caixa.filter(c => new Date(c.criado_em) >= desde) : P.caixa;
  const inicio = desde || (P.caixa.length ? new Date(Math.min(...P.caixa.map(c => +new Date(c.criado_em)))) : null);
  const entradas = sumBy(movs, c => c.valor);
  const gastos = inicio ? sumBy(P.exp.filter(e => e.valor_realizado !== null && e.valor_realizado !== undefined && new Date(e.criado_em) >= inicio), e => e.valor_realizado) : 0;
  const saldo = num(p.caixa_inicial) + entradas - gastos;
  const pend = P.exp.filter(e => (e.valor_realizado === null || e.valor_realizado === undefined) && num(e.valor_previsto) > 0);
  const real = sumBy(P.exp, e => e.valor_realizado);
  const faltaPrev = sumBy(pend, e => e.valor_previsto);
  const usaOrc = !faltaPrev && num(p.orcamento_total) > 0;
  const falta = faltaPrev || Math.max(num(p.orcamento_total) - real, 0);
  const grupos = { pecas: 0, mo: 0, outros: 0 }; pend.forEach(e => grupos[GRUPO[e.tipo] || 'outros'] += num(e.valor_previsto));
  const ap = num(p.aporte_mensal), precisa = Math.max(falta - Math.max(saldo, 0), 0);
  const meses = precisa === 0 ? 0 : ap > 0 ? Math.ceil(precisa / ap) : null;
  // linha do tempo: stages em ordem, cada um entra quando a caixinha acumulada cobre o que falta até ele
  let acum = 0;
  const linha = [{ id: null, nome: 'Geral' }].concat(P.stages.map(s => ({ id: s.id, nome: s.nome }))).map(g => {
    const f = sumBy(pend.filter(e => (e.stage_id || null) === g.id), e => e.valor_previsto);
    if (!f) return null;
    acum += f; const need = Math.max(acum - Math.max(saldo, 0), 0);
    return { nome: g.nome, falta: f, mes: need === 0 ? 0 : ap > 0 ? Math.ceil(need / ap) : null };
  }).filter(Boolean);
  return { saldo, entradas, gastos, movs, falta, usaOrc, grupos, ap, precisa, meses, linha, inicio };
}

async function shrink(file) {
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
  } catch (e) { return file; }
}

// ---------------- Gráficos ----------------
const TIPO_CHART = { peca: '#3987e5', mao_de_obra: '#d95926', frete: '#199e70', servico: '#c98500', outro: '#d55181' };
const PREV_COR = '#6B7078', REAL_COR = '#3987e5';
const tipBox = () => '<div class="tipbox tiny" style="min-height:16px;color:var(--mut2)">Toque num item para ver o valor</div>';
function viewGraficos() {
  if (!S.P.exp.length) return '<div class="card"><b>Sem dados ainda</b><span class="small mut">Lance gastos (previstos ou realizados) para ver os gráficos.</span></div>';
  return chartStages() + chartTipo() + chartAcum();
}
function chartStages() {
  const P = S.P;
  const groups = [{ id: null, nome: 'Geral' }].concat(P.stages.map(s => ({ id: s.id, nome: s.nome })))
    .map(g => Object.assign(g, money(stageExp(g.id)))).filter(g => g.prev || g.real);
  const max = Math.max(1, ...groups.map(g => Math.max(g.prev, g.real)));
  return `<div class="card chart">
    <b>Previsto x realizado por stage</b>
    <div class="row tiny mut" style="gap:14px"><span class="row" style="gap:6px"><i style="width:10px;height:10px;border-radius:2px;background:${PREV_COR};display:inline-block"></i>Previsto</span><span class="row" style="gap:6px"><i style="width:10px;height:10px;border-radius:2px;background:${REAL_COR};display:inline-block"></i>Realizado</span></div>
    ${groups.map(g => { const over = g.prev && g.real > g.prev;
      return `<div class="col" style="gap:4px;cursor:pointer" data-tip="${esc(g.nome)}: realizado ${brl2(g.real)} de ${brl2(g.prev)} previsto${over ? ' (' + brl2(g.real - g.prev) + ' acima)' : ''}">
        <div class="row between small"><span>${esc(g.nome.split(' · ')[0])}${g.nome.includes(' · ') ? `<span class="mut"> · ${esc(g.nome.split(' · ')[1])}</span>` : ''}</span><span class="mut">${brl(g.real)} / ${brl(g.prev)}</span></div>
        ${g.prev ? `<div style="height:8px;border-radius:0 4px 4px 0;background:${PREV_COR};width:${Math.max(1, g.prev / max * 100)}%"></div>` : '<span class="tiny mut">sem previsto</span>'}
        ${g.real ? `<div style="height:8px;border-radius:0 4px 4px 0;background:${REAL_COR};width:${Math.max(1, g.real / max * 100)}%"></div>` : ''}
        ${over ? `<span class="tiny" style="color:var(--bad);font-weight:700">▲ ${brl(g.real - g.prev)} acima do previsto</span>` : ''}
      </div>`; }).join('')}
    ${tipBox()}
  </div>`;
}
function chartTipo() {
  const P = S.P, keys = Object.keys(TIPOS), vals = keys.map(k => sumBy(P.exp.filter(e => e.tipo === k), e => e.valor_realizado));
  const total = vals.reduce((a, b) => a + b, 0);
  if (!total) return '<div class="card"><b>Para onde foi o dinheiro</b><span class="small mut">Aparece quando houver gastos realizados.</span></div>';
  const R = 52, C = 2 * Math.PI * R, GAP = vals.filter(v => v > 0).length > 1 ? 2 : 0; let acc = 0;
  const segs = keys.map((k, i) => { const v = vals[i]; if (!v) return ''; const len = Math.max(v / total * C - GAP, 0.5);
    const s = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${TIPO_CHART[k]}" stroke-width="20" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" transform="rotate(-90 70 70)" data-tip="${TIPOS[k]}: ${brl2(v)} (${Math.round(v / total * 100)}%)" style="cursor:pointer"><title>${TIPOS[k]}: ${brl2(v)}</title></circle>`;
    acc += v / total * C; return s; }).join('');
  return `<div class="card chart">
    <b>Para onde foi o dinheiro</b>
    <div class="row" style="gap:16px;align-items:center">
      <svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="Gasto realizado por tipo" style="flex:none">${segs}
        <text x="70" y="66" text-anchor="middle" font-size="11" fill="#A7AAB0" font-family="Barlow, system-ui, sans-serif">realizado</text>
        <text x="70" y="84" text-anchor="middle" font-size="17" font-weight="700" fill="#F2EFEA" font-family="Barlow Condensed, Barlow, system-ui, sans-serif">${brl(total)}</text></svg>
      <div class="col" style="gap:8px;flex:1;min-width:0">${keys.map((k, i) => vals[i] ? `<div class="row between small" data-tip="${TIPOS[k]}: ${brl2(vals[i])}" style="cursor:pointer"><span class="row" style="gap:6px"><i style="width:10px;height:10px;border-radius:2px;background:${TIPO_CHART[k]};display:inline-block;flex:none"></i>${TIPOS[k]}</span><span class="mut">${Math.round(vals[i] / total * 100)}%</span></div>` : '').join('')}</div>
    </div>
    ${tipBox()}
  </div>`;
}
function chartAcum() {
  const P = S.P, m = money();
  const rows = P.exp.filter(e => e.valor_realizado !== null && e.valor_realizado !== undefined);
  if (!rows.length) return '';
  const byDay = {}; rows.forEach(e => byDay[e.data] = (byDay[e.data] || 0) + num(e.valor_realizado));
  const days = Object.keys(byDay).sort(); let cum = 0;
  const pts = days.map(d => ({ d, v: (cum += byDay[d]) }));
  const W = 340, H = 180, L = 10, Rr = 12, T = 22, B = 24;
  const ymax = Math.max(cum, m.total || m.prev || 0) * 1.12 || 1;
  const t0 = +new Date(days[0]), t1 = +new Date(days[days.length - 1]);
  const x = d => t1 === t0 ? (L + (W - Rr - L) / 2) : L + (+new Date(d) - t0) / (t1 - t0) * (W - Rr - L);
  const y = v => T + (1 - v / ymax) * (H - T - B);
  const path = pts.map((p, i) => (i ? 'L' : 'M') + x(p.d).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  const fmtD = d => new Date(d + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
  const ref = (v, label) => v ? `<line x1="${L}" x2="${W - Rr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="#8C9096" stroke-width="1" stroke-dasharray="4 4"/><text x="${L}" y="${(y(v) - 5).toFixed(1)}" font-size="10.5" fill="#A7AAB0" font-family="Barlow, system-ui, sans-serif">${label} ${brl(v)}</text>` : '';
  const last = pts[pts.length - 1];
  return `<div class="card chart">
    <b>Gasto acumulado</b>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gasto realizado acumulado ao longo do tempo">
      <line x1="${L}" x2="${W - Rr}" y1="${H - B}" y2="${H - B}" stroke="#2A2D33" stroke-width="1"/>
      ${ref(m.total || m.prev, m.total ? 'Orçamento' : 'Previsto')}
      ${pts.length > 1 ? `<path d="${path}" fill="none" stroke="${REAL_COR}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : ''}
      <circle cx="${x(last.d).toFixed(1)}" cy="${y(last.v).toFixed(1)}" r="4.5" fill="${REAL_COR}" stroke="#1A1C20" stroke-width="2"/>
      ${pts.map(p => `<circle cx="${x(p.d).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="13" fill="transparent" data-tip="Até ${fmtD(p.d)}: ${brl2(p.v)} gastos" style="cursor:pointer"/>`).join('')}
      <text x="${L}" y="${H - 7}" font-size="10.5" fill="#A7AAB0" font-family="Barlow, system-ui, sans-serif">${fmtD(days[0])}</text>
      ${days.length > 1 ? `<text x="${W - Rr}" y="${H - 7}" text-anchor="end" font-size="10.5" fill="#A7AAB0" font-family="Barlow, system-ui, sans-serif">${fmtD(days[days.length - 1])}</text>` : ''}
    </svg>
    <span class="small"><b>${brl(last.v)}</b> <span class="mut">gastos até agora${m.total ? ' · ' + Math.round(last.v / m.total * 100) + '% do orçamento' : ''}</span></span>
    ${tipBox()}
  </div>`;
}

// ---------------- Render e eventos ----------------
function render() {
  const v = S.view; S._bn = 0;
  $app.innerHTML = v === 'login' ? viewLogin() : v === 'newpass' ? viewNewPass() : v === 'garage' ? viewGarage() : v === 'wizard' ? viewWizard() : v === 'project' ? viewProject() : v === 'expense' ? viewForm()
    : v === 'admin' ? viewAdmin() : v === 'aoffer' ? viewOfferForm() : v === 'abanner' ? viewBannerForm() : '<div class="center mut">Carregando…</div>';
  if (S.sheet) $app.insertAdjacentHTML('beforeend', viewSheet());
  if (S.modal) $app.insertAdjacentHTML('beforeend', viewModal());
}
$app.addEventListener('click', async ev => {
  if (S.modal) {
    if (ev.target.id === 'modal' || ev.target.id === 'mcancel') { S.modal = null; return render(); }
    if (ev.target.id === 'mok') { const run = S.modal.run; S.modal = null; render(); return run(); }
    return;
  }
  if (S.sheet) {
    const gl = ev.target.closest('[data-golink]'); if (gl) return goLink(gl.dataset.golink);
    if (ev.target.id === 'sheet' || ev.target.closest('#sheetx')) { S.sheet = null; return render(); }
    return;
  }
  const tip = ev.target.closest('[data-tip]');
  if (tip) { const box = tip.closest('.chart')?.querySelector('.tipbox'); if (box) { box.textContent = tip.dataset.tip; box.style.color = 'var(--fg)'; } return; }
  const b = ev.target.closest('button,[data-open],[data-phase],[data-goto]'); if (!b) return;
  const id = b.id, ds = b.dataset;
  if (ds.offers) return openOffers(ds.offers);
  if (ds.banner) return openBanner(ds.banner);
  if (id === 'admin') return openAdmin('ofertas');
  if (id === 'adback') return loadGarage();
  if (ds.atab) return openAdmin(ds.atab);
  if (ds.aoffer) return openOfferForm(ds.aoffer);
  if (ds.abanner) return openBannerForm(ds.abanner);
  if (id === 'afsave') return saveOffer();
  if (id === 'afdel') return deleteOffer();
  if (id === 'absave') return saveBanner();
  if (id === 'abdel') return deleteBanner();
  if (id === 'go') return doAuth();
  if (id === 'swap') { S.mode = S.mode === 'criar' ? 'entrar' : 'criar'; return render(); }
  if (id === 'forgot') return forgot();
  if (id === 'savepass') return savePass();
  if (id === 'logout') { await sb.auth.signOut(); S.view = 'login'; return render(); }
  if (id === 'preset') return startWizard(true);
  if (id === 'novo') return startWizard(false);
  if (ds.open) { S.tab = 'marchas'; S.phase = null; return openProject(ds.open); }
  if (id === 'wback') { keepWiz(); if (S.step === 2) { S.step = 1; return render(); } return loadGarage(); }
  if (ds.goal) { keepWiz(); S.draft.objetivo = ds.goal; return render(); }
  if (ds.praz) { keepWiz(); S.draft.prazo = +ds.praz; return render(); }
  if (id === 'w1') { keepWiz(); S.step = 2; return render(); }
  if (ds.have !== undefined) { keepWiz(); S.draft.tem_carro = ds.have === '1'; return render(); }
  if (ds.pickbrand !== undefined) { keepWiz(); S.pick.brand = ds.pickbrand; return render(); }
  if (ds.pickcar !== undefined) {
    const cid = ds.pickcar || null;
    if (S.view === 'wizard') { keepWiz(); S.draft.car_model_id = cid; S.draft.carOutro = !cid; return render(); }
    S.P.p.car_models = S.cars.find(x => x.id === cid) || null; S.pickOpen = false;
    await saveProj({ car_model_id: cid }); render(); return syncMarcha();
  }
  if (ds.wcheck) { keepWiz(); const [i, st] = ds.wcheck.split('|'); const k = checksFor(S.draft.objetivo)[+i]; if (S.draft.checks[k] === st) delete S.draft.checks[k]; else S.draft.checks[k] = st; return render(); }
  if (id === 'swapcar') { S.pickOpen = !S.pickOpen; S.pick = { brand: '', q: '' }; return render(); }
  if (ds.check) { const [it, st] = ds.check.split('|'); return setCheck(it, st); }
  if (ds.has) { const [iid, val] = ds.has.split('|'); return setHas(iid, val); }
  if (ds.fichachip) { const [k, v] = ds.fichachip.split('|'); await saveFicha(k, S.P.p.ficha?.[k] === v ? null : v); return render(); }
  if (id === 'w2') { keepWiz(); return createProject(); }
  if (id === 'pback') return loadGarage();
  if (ds.phase) { S.phase = +ds.phase; S.tab = 'marchas'; return render(); }
  if (ds.goto) { S.phase = +ds.goto; S.tab = 'marchas'; return render(); }
  if (ds.tab) { S.tab = ds.tab; render(); if (ds.tab === 'diario') loadDiary(); return; }
  if (ds.gview) { S.gview = ds.gview; return render(); }
  if (ds.item) return cycleItem(ds.item);
  if (ds.delitem) return delItem(ds.delitem);
  if (ds.pgoal) { await saveProj({ objetivo: ds.pgoal }); render(); return syncMarcha(); }
  if (ds.pprazo) { await saveProj({ prazo: ds.pprazo }); render(); return syncMarcha(); }
  if (id === 'gotcar') { await saveProj({ tem_carro: true }); render(); return syncMarcha(); }
  if (id === 'delproj') return deleteProject();
  if (id === 'save1') return saveFase1();
  if (ds.cx) return moveCaixa(ds.cx);
  if (ds.delcx) return delCaixa(ds.delcx);
  if (id === 'saveficha') return saveFichaAll();
  if (ds.self) { await saveStage(ds.self, { quem_faz: 'Eu mesmo' }); render(); return syncMarcha(); }
  if (ds.cyc) return toggleCycle(ds.cyc);
  if (id === 'closecyc') return closeCycle();
  if (ds.newexp) return openForm(null, ds.newexp);
  if (ds.exp) { const e = S.P.exp.find(x => x.id === ds.exp); if (e) openForm(e); return; }
  if (id === 'copytsv') return copyTsv();
  if (id === 'fback') { S.view = 'project'; S.tab = S.formBack || 'gastos'; S.form = null; return render(); }
  if (ds.ftipo) { keepForm(); S.form.tipo = ds.ftipo; return render(); }
  if (ds.fstage !== undefined) { keepForm(); if (S.form.stage_id !== (ds.fstage || null)) S.form.project_item_id = null; S.form.stage_id = ds.fstage || null; return render(); }
  if (id === 'fsave') return saveExpense();
  if (id === 'fdel') return deleteExpense();
  if (id === 'dpub') return publishDiary();
  if (ds.deldiary) return delDiary(ds.deldiary);
});
$app.addEventListener('change', async ev => {
  const t = ev.target;
  if (t.id === 'dfotos') { const n = t.files.length; document.getElementById('dcount').textContent = n ? n + (n === 1 ? ' foto escolhida' : ' fotos escolhidas') : 'Nenhuma foto escolhida'; return; }
  if (t.dataset.porc) {
    const v = parseMoney(t.value); t.value = fmtIn(v);
    if (await saveProjById(t.dataset.porc, { orcamento_total: v, orcamento: v ? brl(v) : null })) {
      const m = document.getElementById('money'); if (m) m.innerHTML = moneyStrip();
      const g = document.getElementById('gear'); if (g) g.innerHTML = gearSvg(); syncMarcha(); toast('Orçamento salvo ✓');
    }
    return;
  }
  if (t.id === 'caixa1' || t.id === 'aporte1') { const ok = await saveProjById(S.P.p.id, caixaPatch()); if (ok) { const ce = document.getElementById('caixa1'); if (ce && S.P.p.caixa_desde) ce.value = fmtIn(caixaCalc().saldo); const ae = document.getElementById('aporte1'); if (ae) ae.value = fmtIn(S.P.p.aporte_mensal); toast('Caixinha salva ✓'); } return; }
  if (t.dataset.pname) { const v = t.value.trim(); if (v) await saveProjById(t.dataset.pname, { nome: v }); return; }
  if (t.dataset.who) { await saveStage(t.dataset.who, { quem_faz: t.value.trim() || null }); document.getElementById('gear').innerHTML = gearSvg(); syncMarcha(); return; }
  if (t.dataset.additem) { const v = t.value; t.value = ''; return addItem(t.dataset.additem, v); }
  if (t.dataset.addhave) { const v = t.value; t.value = ''; return addHave(t.dataset.addhave, v); }
  if (t.dataset.ficha) {
    const k = t.dataset.ficha, raw = t.value.trim();
    const v = ['ano', 'km', 'cv_hoje'].includes(k) ? (raw ? (parseInt(raw.replace(/\D/g, ''), 10) || null) : null) : (raw || null);
    if (['ano', 'km', 'cv_hoje'].includes(k)) t.value = v ?? '';
    return saveFicha(k, v);
  }
  if (t.id === 'fitem') { keepForm(); }
});
$app.addEventListener('input', ev => {
  if (ev.target.id !== 'carsearch') return;
  S.pick.q = ev.target.value;
  const sel = S.view === 'wizard' ? S.draft?.car_model_id : S.P?.p.car_model_id;
  const box = document.getElementById('carlist'); if (box) box.innerHTML = carListHtml(sel ?? null);
});
$app.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter') return;
  const t = ev.target;
  if (S.view === 'login' && t.tagName === 'INPUT') return doAuth();
  if (S.view === 'newpass') return savePass();
  if (t.id === 'carsearch') { ev.preventDefault(); t.blur(); return; }
  if (t.id === 'caixa1' || t.id === 'aporte1' || t.id === 'cxval' || t.id === 'cxdesc' || t.dataset.additem || t.dataset.addhave || t.dataset.ficha || t.dataset.porc || t.dataset.pname || t.classList.contains('who')) { ev.preventDefault(); t.blur(); }
});
// ---- Versão do app (troque a cada publicação) e "puxar para atualizar" ----
const APP_VERSION = '6.0.1';
async function refreshNow() {
  try {
    const r = await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' });
    const m = (await r.text()).match(/APP_VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION) { toast('Nova versão! Atualizando…'); setTimeout(() => location.reload(), 700); return; }
  } catch (e) {}
  if (S.view === 'garage') await loadGarage();
  else if (S.view === 'project' && S.P) await openProject(S.P.p.id, true);
  else return;
  toast('Atualizado ✓');
}
(function pullToRefresh() {
  const el = document.createElement('div'); el.id = 'ptr'; el.setAttribute('aria-hidden', 'true');
  el.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF8A4C" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>';
  document.body.appendChild(el);
  const svg = el.firstChild, LIMIT = 70;
  let y0 = null, dy = 0, busy = false;
  const typing = () => { const a = document.activeElement; return a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT'); };
  addEventListener('touchstart', e => {
    if (busy || window.scrollY > 0 || S.modal || typing() || document.getElementById('splash') || !['garage', 'project'].includes(S.view)) { y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0;
  }, { passive: true });
  addEventListener('touchmove', e => {
    if (y0 === null) return;
    if (window.scrollY > 0) { y0 = null; el.style.opacity = 0; return; }
    dy = Math.max(0, e.touches[0].clientY - y0);
    const d = Math.min(dy * .5, 95);
    el.style.transition = 'none'; el.style.transform = `translate(-50%,${d - 70}px)`; el.style.opacity = Math.min(1, d / LIMIT);
    svg.style.transform = `rotate(${d * 4}deg)`;
  }, { passive: true });
  addEventListener('touchend', async () => {
    if (y0 === null) return;
    y0 = null; el.style.transition = '';
    if (dy * .5 >= LIMIT) {
      busy = true; svg.style.transform = ''; el.classList.add('spin'); el.style.transform = 'translate(-50%,16px)'; el.style.opacity = 1;
      try { await refreshNow(); } catch (e) { fail(e); }
      busy = false; el.classList.remove('spin');
    }
    el.style.transform = 'translate(-50%,-70px)'; el.style.opacity = 0; dy = 0;
  });
})();

init().catch(fail);
